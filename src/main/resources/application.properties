spring.application.name=cinebook
server.port=${PORT:8080}

# Persistent file-based H2 database stored in ./data/cinebook.mv.db
spring.datasource.url=jdbc:h2:file:./data/cinebook;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Run schema.sql on every startup (it uses CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# H2 web console is disabled by default; enable only for local inspection.
spring.h2.console.enabled=false

server.error.include-stacktrace=never
